<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 517.54 222.66">
  <defs>
    <style>

      /* Montserrat, cut down to the nine letters and the space this wordmark
         uses, and embedded as data. Not decoration: an SVG loaded through an
         img element renders in an isolated document that may not fetch a
         webfont, so a family that is named but not embedded falls through to
         the browser's standard face — a serif on most machines, and a
         different one on each. A data URI is part of the document rather than
         a fetch, so it works where a link does not. The class rules below are
         the drawing's own and are untouched; their second choice,
         "Montserrat", is what these two faces answer to.

         Montserrat is licensed under the SIL Open Font License 1.1, and the
         licence travels with the subset: each face keeps the copyright notice
         and the licence in its own name table, and the full text sits beside
         this file as MONTSERRAT-OFL.txt. 5 kB a face before base64, which is
         why a 2 kB drawing is a 17 kB one. */
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .cls-1 {
        font-size: 70.23px;
      }

      .cls-1, .cls-2 {
        fill: #003865;
      }

      .cls-3 {
        letter-spacing: 0em;
      }

      .cls-4 {
        font-family: Montserrat-Regular, Montserrat;
        font-variation-settings: 'wght' 400;
      }

      .cls-5 {
        font-family: Montserrat-Bold, Montserrat;
        font-variation-settings: 'wght' 700;
        font-weight: 700;
      }

      .cls-6 {
        letter-spacing: 0em;
      }
    </style>
  </defs>
